# ============================================================================
# 去签名校验载荷镜像同步
# ============================================================================
# 触发：
#   - repository_dispatch (uncheck-payload-updated)：artifact-pipeline 的
#     scripts/uncheck/payload/** 变更时主动通知
#     （见该仓库 .github/workflows/notify-json-mirror.yml）
#   - workflow_dispatch：手动触发（dispatch 失败时的兜底）
#   - push：脚本/工作流自身变更时自动跑一次验证
#
# 产出物：backend/uncheck/{boot.dex,payload.dex,libusign_arm64.so,
#                          libusign_armv7.so,index.json}
# 提交：commit message 带 [skip ci]
#
# 为什么没有 schedule：
#   这四个载荷是 artifact-pipeline 自己的构建产物，不改就不变。
#   与 antutu / github-star 那类「抓别人会变的数据」不同，
#   只在源仓库 push 时同步即可。
#
# 与 apk-schema.yml 的关系：
#   两条独立的镜像线（schema 给加固、payload 给去校验），
#   刻意分开 —— 混在一起时一条失败会连带另一条不更新。
#
# 可选 secret：
#   GH_UNCHECK_SOURCE_TOKEN — 拉取源仓库用。源仓库公开时不需要；
#   配置后可提高速率上限，也兼容源仓库转私有的情况。
# ============================================================================

name: Uncheck Payload Mirror

on:
  repository_dispatch:
    types: [uncheck-payload-updated]
  workflow_dispatch:
  push:
    paths:
      - "scripts/uncheck_payload_sync.py"
      - ".github/workflows/uncheck-payload.yml"

permissions:
  contents: write

concurrency:
  group: uncheck-payload-mirror
  cancel-in-progress: true

jobs:
  sync:
    name: Sync & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log dispatch origin
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_SHA: ${{ github.event.client_payload.source_sha }}
          CLIENT_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          echo "来源仓库: ${CLIENT_REPO:-未知}"
          echo "来源提交: ${CLIENT_SHA:-未知}"

      - name: Fetch payload from source repo
        env:
          GH_UNCHECK_SOURCE_TOKEN: ${{ secrets.GH_UNCHECK_SOURCE_TOKEN }}
        run: python3 scripts/uncheck_payload_sync.py

      # 提交前把将要发布的事实打出来。
      # 这个模块的失败形态是「同步成功、App 照常拿到旧载荷」——
      # 版本号与 sha256 出现在日志里，事后能直接对上 App 显示的 vXXXX。
      - name: Show resulting index
        run: cat backend/uncheck/index.json

      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uncheck

          if ! git diff --cached --quiet; then
            VER=$(python3 -c "import json;print(json.load(open('backend/uncheck/index.json'))['version'])")
            git commit -m "🤖 uncheck-payload: sync from artifact-pipeline (v${VER}) [skip ci]"
            # 默认 remote 无凭据，换成带 token 的地址才能推送
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          else
            echo "载荷无变化，跳过提交"
          fi
